#ui-grafo {
    position: fixed; top: 12px; right: 12px; z-index: 9999;

    background: rgba(255,255,255,0.93);

}
#ui-grafo input {

    font-size: 13px; width: 115px; outline: none;
}
#ui-grafo button {
    padding: 5px 12px; border: none; border-radius: 5px;
    cursor: pointer; font-size: 13px; font-weight: 600;
}
#btn-busca { background: #1f3a6e; color: #fff; }
#btn-rotas { background: #e03030; color: #fff; }
</style>
<div id='ui-grafo'>
    <input id='iata-input' type='text' placeholder='Buscar IATA...' onkeydown="if(event.key==='Enter') buscarNo()" />
    <button id='btn-busca' onclick='buscarNo()'>Buscar</button>
    <button id='btn-rotas' onclick='toggleRotas()'>Ocultar rotas</button>
</div>
<script>
var _obrig = [["MAO", "BEL"], ["BEL", "GRU"], ["REC", "GRU"], ["GRU", "BSB"], ["BSB", "CWB"], ["CWB", "FLN"], ["FLN", "POA"]];
var _rotasOn = true;
function buscarNo() {
    var cod = document.getElementById('iata-input').value.trim().toUpperCase();
    if (!cod) return;
    if (!nodes || !nodes.get(cod)) {
        alert('Aeroporto "' + cod + '" nao encontrado.');
        return;
    }
    network.focus(cod, {scale: 2.0, animation: {duration: 600}});
    network.selectNodes([cod]);
}
function toggleRotas() {
    _rotasOn = !_rotasOn;
    var lista = edges.get();
    var upd = [];
    lista.forEach(function(e) {
        var k1 = String(e.from) + '|' + String(e.to);
        var k2 = String(e.to)  + '|' + String(e.from);
        var eh = _obrig.some(function(p) {
            return (p[0]+'|'+p[1]) === k1 || (p[0]+'|'+p[1]) === k2;
        });
        if (eh) {
            upd.push({
                id: e.id,
                color: {color: _rotasOn ? '#e03030' : '#bbbbbb'},
                width: _rotasOn ? 3 : 1
            });
        }
    });
    edges.update(upd);
    document.getElementById('btn-rotas').textContent =
        _rotasOn ? 'Ocultar rotas' : 'Mostrar rotas';
}
</script>
