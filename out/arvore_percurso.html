    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#4c72b0", "id": "BSB", "label": "BSB", "shape": "dot", "size": 22, "title": "\u003cb\u003eBSB\u003c/b\u003e \u2014 Bras\u00edlia\u003cbr\u003eCentro-Oeste"}, {"color": "#e05c5c", "id": "GRU", "label": "GRU", "shape": "dot", "size": 22, "title": "\u003cb\u003eGRU\u003c/b\u003e \u2014 S\u00e3o Paulo\u003cbr\u003eSudeste"}, {"color": "#e05c5c", "id": "MAO", "label": "MAO", "shape": "dot", "size": 22, "title": "\u003cb\u003eMAO\u003c/b\u003e \u2014 Manaus\u003cbr\u003eNorte"}, {"color": "#4c72b0", "id": "REC", "label": "REC", "shape": "dot", "size": 22, "title": "\u003cb\u003eREC\u003c/b\u003e \u2014 Recife\u003cbr\u003eNordeste"}, {"color": "#e05c5c", "id": "BEL", "label": "BEL", "shape": "dot", "size": 22, "title": "\u003cb\u003eBEL\u003c/b\u003e \u2014 Bel\u00e9m\u003cbr\u003eNorte"}, {"color": "#4c72b0", "id": "POA", "label": "POA", "shape": "dot", "size": 22, "title": "\u003cb\u003ePOA\u003c/b\u003e \u2014 Porto Alegre\u003cbr\u003eSul"}, {"color": "#4c72b0", "id": "FLN", "label": "FLN", "shape": "dot", "size": 22, "title": "\u003cb\u003eFLN\u003c/b\u003e \u2014 Florian\u00f3polis\u003cbr\u003eSul"}, {"color": "#4c72b0", "id": "CWB", "label": "CWB", "shape": "dot", "size": 22, "title": "\u003cb\u003eCWB\u003c/b\u003e \u2014 Curitiba\u003cbr\u003eSul"}]);
                  edges = new vis.DataSet([{"color": "#e05c5c", "from": "MAO", "title": "Manaus \u2192 S\u00e3o Paulo | peso 1.0", "to": "BEL", "width": 3}, {"color": "#e05c5c", "from": "BEL", "title": "Manaus \u2192 S\u00e3o Paulo | peso 2.0", "to": "GRU", "width": 3}, {"color": "#4c72b0", "from": "REC", "title": "Recife \u2192 Porto Alegre | peso 2.0", "to": "GRU", "width": 3}, {"color": "#4c72b0", "from": "GRU", "title": "Recife \u2192 Porto Alegre | peso 1.5", "to": "BSB", "width": 3}, {"color": "#4c72b0", "from": "BSB", "title": "Recife \u2192 Porto Alegre | peso 2.0", "to": "CWB", "width": 3}, {"color": "#4c72b0", "from": "CWB", "title": "Recife \u2192 Porto Alegre | peso 1.0", "to": "FLN", "width": 3}, {"color": "#4c72b0", "from": "FLN", "title": "Recife \u2192 Porto Alegre | peso 1.0", "to": "POA", "width": 3}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
