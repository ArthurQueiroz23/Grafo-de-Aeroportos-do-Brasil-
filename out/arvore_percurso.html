        <center>

        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 520px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

             

             

             
        </style>

    <body>
        <div class="card" style="width: 100%">
            
                <div id="select-menu" class="card-header">
                    <div class="row no-gutters">
                        <div class="col-10 pb-2">
                            <select
                            class="form-select"
                            aria-label="Default select example"
                            onchange="selectNode([value]);"
                            id="select-node"
                            placeholder="Select node..."
                            >
                                <option selected>Select a Node by ID</option>
                                
                                    <option value="BEL">BEL</option>
                                
                                    <option value="BSB">BSB</option>
                                
                                    <option value="CWB">CWB</option>
                                
                                    <option value="FLN">FLN</option>
                                
                                    <option value="GRU">GRU</option>
                                
                                    <option value="MAO">MAO</option>
                                
                                    <option value="POA">POA</option>
                                
                                    <option value="REC">REC</option>
                                
                            </select>
                        </div>
                        <div class="col-2 pb-2">
                            <button type="button" class="btn btn-primary btn-block" onclick="neighbourhoodHighlight({nodes: []});">Reset Selection</button>
                        </div>
                    </div>
                </div>
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              
                  new TomSelect("#select-node",{
                      create: false,
                      sortField: {
                          field: "text",
                          direction: "asc"
                      }
                  });
              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"borderWidth": 1, "color": "#97c2fc", "font": {"color": "#222222"}, "id": "BEL", "label": "BEL", "shape": "dot", "title": "\u003cb\u003eBEL\u003c/b\u003e\u003cbr\u003eRegi\u00e3o: Norte\u003cbr\u003eGrau: 3\u003cbr\u003eDensidade ego: 0.5000"}, {"borderWidth": 1, "color": "#97c2fc", "font": {"color": "#222222"}, "id": "BSB", "label": "BSB", "shape": "dot", "title": "\u003cb\u003eBSB\u003c/b\u003e\u003cbr\u003eRegi\u00e3o: Centro-Oeste\u003cbr\u003eGrau: 4\u003cbr\u003eDensidade ego: 0.4000"}, {"borderWidth": 1, "color": "#97c2fc", "font": {"color": "#222222"}, "id": "CWB", "label": "CWB", "shape": "dot", "title": "\u003cb\u003eCWB\u003c/b\u003e\u003cbr\u003eRegi\u00e3o: Sul\u003cbr\u003eGrau: 2\u003cbr\u003eDensidade ego: 0.6667"}, {"borderWidth": 1, "color": "#97c2fc", "font": {"color": "#222222"}, "id": "FLN", "label": "FLN", "shape": "dot", "title": "\u003cb\u003eFLN\u003c/b\u003e\u003cbr\u003eRegi\u00e3o: Sul\u003cbr\u003eGrau: 2\u003cbr\u003eDensidade ego: 0.6667"}, {"borderWidth": 1, "color": "#97c2fc", "font": {"color": "#222222"}, "id": "GRU", "label": "GRU", "shape": "dot", "title": "\u003cb\u003eGRU\u003c/b\u003e\u003cbr\u003eRegi\u00e3o: Sudeste\u003cbr\u003eGrau: 6\u003cbr\u003eDensidade ego: 0.2857"}, {"borderWidth": 1, "color": "#97c2fc", "font": {"color": "#222222"}, "id": "MAO", "label": "MAO", "shape": "dot", "title": "\u003cb\u003eMAO\u003c/b\u003e\u003cbr\u003eRegi\u00e3o: Norte\u003cbr\u003eGrau: 2\u003cbr\u003eDensidade ego: 0.6667"}, {"borderWidth": 1, "color": "#97c2fc", "font": {"color": "#222222"}, "id": "POA", "label": "POA", "shape": "dot", "title": "\u003cb\u003ePOA\u003c/b\u003e\u003cbr\u003eRegi\u00e3o: Sul\u003cbr\u003eGrau: 1\u003cbr\u003eDensidade ego: 1.0000"}, {"borderWidth": 1, "color": "#97c2fc", "font": {"color": "#222222"}, "id": "REC", "label": "REC", "shape": "dot", "title": "\u003cb\u003eREC\u003c/b\u003e\u003cbr\u003eRegi\u00e3o: Nordeste\u003cbr\u003eGrau: 2\u003cbr\u003eDensidade ego: 0.6667"}]);
                  edges = new vis.DataSet([{"color": "#2980b9", "from": "BEL", "to": "MAO", "value": 1.0, "width": 3}, {"color": "#e67e22", "from": "CWB", "to": "FLN", "value": 1.0, "width": 3}, {"color": "#e67e22", "from": "GRU", "to": "REC", "value": 2.0, "width": 3}, {"color": "#2980b9", "from": "BEL", "to": "GRU", "value": 2.0, "width": 3}, {"color": "#e67e22", "from": "BSB", "to": "CWB", "value": 2.0, "width": 3}, {"color": "#e67e22", "from": "BSB", "to": "GRU", "value": 1.5, "width": 3}, {"color": "#e67e22", "from": "FLN", "to": "POA", "value": 1.0, "width": 3}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  
                    network.on("selectNode", neighbourhoodHighlight);
                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
